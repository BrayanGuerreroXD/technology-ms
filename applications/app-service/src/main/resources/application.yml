server:
  port: 7600
spring:
  application:
    name: technology-ms
  devtools:
    add-properties: false
  r2dbc:
    url: r2dbc:mysql://localhost:3306/db_technology
    username: root
    password: 1234
  flyway:
    url: jdbc:mysql://localhost:3306/db_technology
    user: root
    password: 1234
    locations: classpath:db/migration
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:7600"
